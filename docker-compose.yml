name: vaultguard

services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: vaultguard-api:latest
    container_name: vaultguard-api
    environment:
      MODEL_PATH: /code/models/logistic_regression_model.joblib
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: UI/Dockerfile
    image: vaultguard-ui:latest
    container_name: vaultguard-ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped